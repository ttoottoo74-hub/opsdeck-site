<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok 연결 — OpsDeck</title>
<link rel="stylesheet" href="style.css">
<style>
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; word-break: break-all; font-size: 14px; margin: 10px 0 0;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button, .btn {
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .bad { color: #c0392b; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./"><span class="mark">O</span><strong>OpsDeck</strong></a>
  </header>

  <h1>TikTok 연결</h1>
  <div id="state"><p class="lead">콘솔로 넘어가는 중입니다…</p></div>

  <div class="box" id="manual" hidden>
    <p><strong>콘솔로 자동 전달되지 않았다면</strong> 아래 버튼을 누르세요.
    콘솔이 실행 중이어야 합니다(기본 주소 <code>127.0.0.1:8787</code>).</p>
    <div class="row">
      <a class="btn" id="go" href="#">콘솔로 전달</a>
      <button type="button" class="ghost" id="copy">인증 코드 복사</button>
    </div>
    <p class="code" id="code"></p>
  </div>

  <footer>
    <p>이 페이지는 TikTok 인증 결과를 받아 사용자의 컴퓨터에서 실행 중인 콘솔로 넘겨주기 위한 것입니다.
    인증 코드는 이 페이지에 저장되지 않으며, 서버로 전송되지도 않습니다.</p>
    <p><a href="./">OpsDeck 소개</a> · <a href="privacy.html">개인정보처리방침</a></p>
  </footer>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var code = params.get("code");
  var state = params.get("state") || "";
  var error = params.get("error_description") || params.get("error");
  var box = document.getElementById("state");
  var manual = document.getElementById("manual");

  function fail(message) {
    box.innerHTML = '<p class="bad">' + message + "</p>";
  }

  if (error) {
    fail("TikTok 인증이 취소되었거나 실패했습니다: " + String(error).replace(/[<>&]/g, ""));
    return;
  }
  if (!code) {
    fail("인증 코드가 없습니다. 콘솔에서 연결을 다시 시작하세요.");
    return;
  }

  var target = "http://127.0.0.1:" + (params.get("port") || "8787") + "/api/tiktok/callback" +
    "?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);

  document.getElementById("code").textContent = code;
  document.getElementById("go").href = target;
  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(code).then(function () { btn.textContent = "복사했습니다"; });
  });

  // 로컬 콘솔로는 페이지 이동으로 넘긴다. https 페이지에서 fetch로 부르면
  // 혼합 콘텐츠와 사설 네트워크 제한에 걸려 브라우저가 막는다.
  // 콘솔이 꺼져 있으면 이동에 실패하므로, 돌아왔을 때 쓸 수 있도록 코드를 함께 보여둔다.
  manual.hidden = false;
  setTimeout(function () { location.href = target; }, 600);
})();
</script>
</body>
</html>
